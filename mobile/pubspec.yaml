name: myidealbody_ai
description: Photo-first calorie and protein estimates with transparent confidence ranges.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
