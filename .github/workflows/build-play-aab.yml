name: Build signed Play AAB

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Build a local fixed-result demo, or the separately gated real-photo client
        required: true
        default: local_demo
        type: choice
        options:
          - local_demo
          - production_photo
      version_name:
        description: Android version name, for example 0.1.0
        required: true
        default: 0.1.0
        type: string
      version_code:
        description: New positive Android version code; increment it for every Play upload
        required: true
        default: "1"
        type: string
      release_confirmation:
        description: Confirm the selected data-flow and Play track
        required: true
        default: LOCAL_DEMO_INTERNAL_OR_CLOSED_TEST
        type: choice
        options:
          - LOCAL_DEMO_INTERNAL_OR_CLOSED_TEST
          - BUILD_SIGNED_REAL_PHOTO_AAB

permissions:
  contents: read

concurrency:
  group: signed-play-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build signed ${{ inputs.release_mode }} bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate branch, mode, version, API, and permanent app ID
        working-directory: .
        env:
          API_BASE_URL: ${{ inputs.release_mode == 'production_photo' && secrets.PRODUCTION_API_BASE_URL || '' }}
          GITHUB_REF: ${{ github.ref }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: python3 scripts/validate_play_release.py
      - name: Require committed Flutter dependency lock
        working-directory: .
        run: test -s mobile/pubspec.lock
      - name: Verify production API health without exposing its URL
        if: ${{ inputs.release_mode == 'production_photo' }}
        working-directory: .
        env:
          API_BASE_URL: ${{ inputs.release_mode == 'production_photo' && secrets.PRODUCTION_API_BASE_URL || '' }}
        run: python3 scripts/check_production_health.py
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve dependencies and generate localization
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
      - name: Analyze and test release source
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build and verify signed AAB
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/myidealbody-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          API_BASE_URL: ${{ inputs.release_mode == 'production_photo' && secrets.PRODUCTION_API_BASE_URL || '' }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          umask 077

          for variable in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required Android signing secrets are not fully configured."
              exit 1
            fi
          done

          defines_file="$RUNNER_TEMP/myidealbody-dart-defines.json"
          verification_log="$RUNNER_TEMP/myidealbody-jarsigner.txt"
          cleanup() {
            rm -f "$ANDROID_UPLOAD_STORE_FILE" "$defines_file" "$verification_log"
          }
          trap cleanup EXIT

          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_UPLOAD_STORE_FILE"
          unset ANDROID_UPLOAD_KEYSTORE_BASE64
          test -s "$ANDROID_UPLOAD_STORE_FILE"
          keytool -list \
            -keystore "$ANDROID_UPLOAD_STORE_FILE" \
            -storepass:env ANDROID_UPLOAD_STORE_PASSWORD \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" > /dev/null

          if [[ -n "${ANDROID_UPLOAD_CERT_SHA256:-}" ]]; then
            actual_fingerprint="$(
              keytool -exportcert \
                -keystore "$ANDROID_UPLOAD_STORE_FILE" \
                -storepass:env ANDROID_UPLOAD_STORE_PASSWORD \
                -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
                | sha256sum | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]'
            )"
            expected_fingerprint="$(
              printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" \
                | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'
            )"
            if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
              echo "::error::The upload certificate does not match the configured fingerprint."
              exit 1
            fi
          fi

          build_arguments=(
            --release
            --build-name="$VERSION_NAME"
            --build-number="$VERSION_CODE"
            --dart-define=APP_VERSION="$VERSION_NAME"
          )
          if [[ "$RELEASE_MODE" == "local_demo" ]]; then
            build_arguments+=(--dart-define=DEMO_MODE=true)
          else
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "myidealbody-dart-defines.json").write_text(
              json.dumps(
                  {
                      "API_BASE_URL": os.environ["API_BASE_URL"],
                      "DEMO_MODE": "false",
                  }
              ),
              encoding="utf-8",
          )
          PY
            build_arguments+=(--dart-define-from-file="$defines_file")
          fi

          flutter build appbundle "${build_arguments[@]}"

          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" > "$verification_log"
          if ! grep -Fq 'jar verified.' "$verification_log"; then
            echo "::error::The generated Android App Bundle did not pass signature verification."
            exit 1
          fi

          mkdir -p build/play-release
          artifact="myidealbody-${RELEASE_MODE}-${VERSION_NAME}-${VERSION_CODE}.aab"
          cp "$bundle" "build/play-release/$artifact"
          sha256sum "build/play-release/$artifact" \
            > "build/play-release/$artifact.sha256"
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myidealbody-${{ inputs.release_mode }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: mobile/build/play-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
