name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python ../scripts/validate_repo.py
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  mobile:
    runs-on: ubuntu-latest
    outputs:
      test_diagnostic: ${{ steps.test.outputs.diagnostic }}
      build_diagnostic: ${{ steps.build.outputs.diagnostic }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Normalize formatting in the isolated runner before analysis and tests.
      # Contributors can run the stricter local check documented in README.md.
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test and expose first failure
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test --machine 2>&1 | tee /tmp/flutter-test.log
          status=${PIPESTATUS[0]}
          diagnostic=$(python3 - <<'PY'
          import json

          tests = {}
          messages = {}
          failure = None
          with open('/tmp/flutter-test.log', encoding='utf-8') as lines:
              for line in lines:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('type') == 'testStart':
                      test = event.get('test', {})
                      tests[test.get('id')] = test.get('name', 'unknown test')
                  elif event.get('type') == 'print':
                      messages.setdefault(event.get('testID'), []).append(event.get('message', ''))
                  if event.get('type') == 'error':
                      failure = ' '.join(event.get('error', '').split())
                      break
                  if event.get('type') == 'testDone' and event.get('result') != 'success':
                      test_id = event.get('testID')
                      detail = ' '.join(messages.get(test_id, []))
                      failure = f"{tests.get(test_id, 'unknown test')}: {detail}"
                      break
          if failure:
              print(failure[:220])
          PY
          )
          if [ "$status" -ne 0 ] && [ -z "$diagnostic" ]; then
            diagnostic=$(tail -n 3 /tmp/flutter-test.log | tr '\n' ' ')
          fi
          printf 'diagnostic=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Build APK and expose first failure
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid 2>&1 | tee /tmp/flutter-build.log
          status=${PIPESTATUS[0]}
          diagnostic=''
          if [ "$status" -ne 0 ]; then
            diagnostic=$(python3 - <<'PY'
          with open('/tmp/flutter-build.log', encoding='utf-8', errors='replace') as source:
              lines = [line.strip() for line in source]

          start = next(
              (index + 1 for index, line in enumerate(lines) if line == '* What went wrong:'),
              None,
          )
          if start is None:
              selected = lines[-8:]
          else:
              selected = []
              for line in lines[start:]:
                  if line.startswith('* Try:'):
                      break
                  if line:
                      selected.append(line)
          print(' '.join(selected)[:220])
          PY
            )
          fi
          printf 'diagnostic=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
          exit "$status"

  test-diagnostic:
    if: ${{ always() && needs.mobile.outputs.test_diagnostic != '' }}
    needs: mobile
    name: ${{ needs.mobile.outputs.test_diagnostic }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test diagnostic exposed in this job name."

  build-diagnostic:
    if: ${{ always() && needs.mobile.outputs.build_diagnostic != '' }}
    needs: mobile
    name: ${{ needs.mobile.outputs.build_diagnostic }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build diagnostic exposed in this job name."
