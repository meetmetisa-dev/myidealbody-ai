name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python ../scripts/validate_repo.py
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  mobile:
    runs-on: ubuntu-latest
    outputs:
      analyzer_diagnostic: ${{ steps.analyze.outputs.diagnostic }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Normalize formatting in the isolated runner before analysis and tests.
      # Contributors can run the stricter local check documented in README.md.
      - run: dart format lib test
      - name: Analyze and expose first diagnostic
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter-analyze.log
          status=${PIPESTATUS[0]}
          diagnostic=$(grep -m1 -E '(^|[[:space:]])error •' /tmp/flutter-analyze.log || true)
          if [ -z "$diagnostic" ]; then
            diagnostic=$(tail -n 3 /tmp/flutter-analyze.log | head -n 1)
          fi
          diagnostic=${diagnostic//$'\r'/ }
          diagnostic=${diagnostic//$'\n'/ }
          printf 'diagnostic=%s\n' "${diagnostic:0:220}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid

  analyzer-diagnostic:
    if: ${{ always() && needs.mobile.outputs.analyzer_diagnostic != '' }}
    needs: mobile
    name: ${{ needs.mobile.outputs.analyzer_diagnostic }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Analyzer diagnostic exposed in this job name."
